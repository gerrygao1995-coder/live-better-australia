<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630"><rect width="1200" height="630" fill="#f8f5eb"/><rect x="0" y="0" width="18" height="630" fill="#b83f23"/><text x="76" y="76" font-family="Arial,sans-serif" font-weight="700" font-size="22" letter-spacing="2" fill="#153c35">LIVE BETTER AUSTRALIA</text><path d="M76 106H1124" stroke="#cbd5c9"/><text x="76" y="235" font-family="Arial,sans-serif" font-weight="700" font-size="84" letter-spacing="-3" fill="#153c35">Australian life.</text><text x="76" y="330" font-family="Arial,sans-serif" font-weight="700" font-size="84" letter-spacing="-3" fill="#b83f23">Made easier.</text><text x="79" y="395" font-family="Arial,sans-serif" font-size="29" fill="#49645c">Know your rights. Cut everyday costs. Find your next step.</text><rect x="76" y="456" width="1048" height="97" rx="10" fill="#153c35"/><text x="106" y="494" font-family="Arial,sans-serif" font-weight="700" font-size="24" fill="#f8f5eb">20 useful things to know + 3 practical checklists</text><text x="106" y="529" font-family="Arial,sans-serif" font-size="21" fill="#e8edda">Free to read. Australian sources. Built to pass on.</text><text x="79" y="598" font-family="Arial,sans-serif" font-size="19" fill="#49645c">SPEND LESS. STRESS LESS. LIVE MORE.</text></svg>